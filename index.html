</head><body><h1>rclone OAuth 应用</h1>
<p>这是一个个人使用的 OAuth 应用，供 <a href="https://rclone.org/">rclone</a> 通过 Google Drive API 备份与同步文件。</p>
<h2>用途</h2><ul><li>使用 rclone 在 Google Drive 与本地/服务器之间同步文件</li>
<li>仅由账号持有人本人使用，不对外提供服务</li></ul>
<h2>申请的权限</h2><ul><li><code>drive</code>：读写 Google Drive 文件</li>
<li><code>drive.metadata.readonly</code>：读取文件元数据</li></ul>
<p>权限仅用于上述用途，不用于广告或转售。</p>
<h2>链接</h2><p><a href="./privacy.html">隐私政策</a> · <a href="https://rclone.org/">rclone 官网</a></p>
